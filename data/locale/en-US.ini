Settings.IfOBSCapturesOneOf="If OBS captures one of these applications (game or window capture) or it's the active window, the plugin switches to the category instantly and without AI – 100 % reliable and free.<br><b>Emulators:</b> add the same application several times, each with part of the window title (e.g. <code>Dolphin.exe</code> + “Mario Kart” and <code>Dolphin.exe</code> + “Sunshine”). Rows with a window title take priority.<br><b>Own title</b> (optional, placeholders as in the template) and <b>tags</b> only apply to this game."
