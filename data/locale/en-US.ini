Settings.PlaceholdersCodeGameCodeTwitch="Placeholders: <code>{game}</code> = Twitch category, <code>{scene}</code> = situation in the game (e.g. “Boss fight against the Ender Dragon”), <code>{keywords}</code> = keywords from your voice. Empty placeholders disappear together with the separator before them. The template also steps in when the AI title fails."
