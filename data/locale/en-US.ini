Provider.Gemini="Google Gemini"
Provider.Gemini.Help="Create a key: <a href=\"https://aistudio.google.com/apikey\">aistudio.google.com/apikey</a>. In the EU, Switzerland and the UK, Google only allows the paid API for programs like this one (Google Cloud project with billing)."
Provider.OpenRouter="OpenRouter (free models)"
Provider.OpenRouter.Help="Key: <a href=\"https://openrouter.ai/keys\">openrouter.ai/keys</a>. Without credit only about 50 requests per day – then set the check interval to at least 5 minutes."
Provider.Ollama="Ollama (local, no key)"
Provider.Ollama.Help="Runs entirely on your PC: install <a href=\"https://ollama.com\">ollama.com</a> and download a vision model: <code>ollama pull qwen3-vl:4b-instruct</code> (3.3 GB). Needs about 4 GB of video memory and takes a few seconds per check on the graphics card."
Provider.Custom="Own server (OpenAI-compatible)"
Provider.Custom.Help="Any service with an OpenAI-compatible API, e.g. LM Studio. Enter the server URL including <code>/v1</code>."
Provider.Claude="Anthropic Claude (paid)"
Provider.Claude.Help="Very reliable detection, but costs per request. Key: <a href=\"https://platform.claude.com\">platform.claude.com</a>"
Provider.LmStudio="LM Studio (local, no key)"
Provider.LmStudio.Help="Runs on your PC: install <a href=\"https://lmstudio.ai\">lmstudio.ai</a>, load a vision model (e.g. Qwen3-VL 4B) and start the local server under <b>Developer</b>. Then click “Load models” here."
Provider.Jan="Jan (local, no key)"
Provider.Jan.Help="Runs on your PC: install <a href=\"https://jan.ai\">jan.ai</a>, load a vision model and start the server under <b>Settings → Local API Server</b>. Then click “Load models” here."
Provider.LlamaCpp="llama.cpp server (local, no key)"
Provider.LlamaCpp.Help="For tinkerers: start <code>llama-server -m model.gguf --mmproj mmproj.gguf --port 8080</code> with a vision model. The model name doesn't matter."
Provider.Groq="Groq (free key)"
Provider.Groq.Help="Very fast, free key with a daily limit: <a href=\"https://console.groq.com/keys\">console.groq.com/keys</a>. Groq discontinued its Llama vision models in July 2026 – click “Load models” and choose a Qwen model with image understanding (marked as preview on Groq)."
Provider.Mistral="Mistral (EU)"
Provider.Mistral.Help="European provider. Key: <a href=\"https://console.mistral.ai/api-keys\">console.mistral.ai</a>. The free tier is very limited, otherwise it's paid. In free mode Mistral may use requests for training – you can opt out in your account's privacy settings."
Provider.Nvidia="NVIDIA NIM (free key)"
Provider.Nvidia.Help="Free key after signing up: <a href=\"https://build.nvidia.com\">build.nvidia.com</a> → open a model → “Get API Key” (starts with <code>nvapi-</code>). Recommended: <code>nvidia/nemotron-3-nano-omni-30b-a3b-reasoning</code> – detects reliably and answers within a few seconds. Many other models in the list aren't enabled for free accounts or are often overloaded."
Provider.Cloudflare="Cloudflare Workers AI (free daily quota)"
Provider.Cloudflare.Help="Free daily quota with a Cloudflare account: create an <a href=\"https://dash.cloudflare.com/profile/api-tokens\">API token</a> with the “Workers AI” permission and enter it as the key. In the server URL, replace <code>ACCOUNT_ID</code> with your account ID (shown in the Cloudflare dashboard). Another vision model: <code>@cf/mistralai/mistral-small-3.1-24b-instruct</code>."

