Settings.OnYouTubePluginChangesB="On YouTube the plugin changes the <b>title</b> of your livestream (the YouTube API doesn't offer a game category like Twitch). For this you need your own free Google Cloud project once:<ol><li><a href=\"https://console.cloud.google.com/projectcreate\">Create a project</a> (any name)</li><li>Enable the <a href=\"https://console.cloud.google.com/apis/library/youtube.googleapis.com\">YouTube Data API v3</a></li><li>Set up the <a href=\"https://console.cloud.google.com/auth/overview\">OAuth consent screen</a>: type <b>External</b>, and add your own Google account under <b>Audience → Test users</b></li><li><a href=\"https://console.cloud.google.com/auth/clients\">Create a client</a>: type <b>TVs and Limited Input devices</b></li><li>Enter the client ID and client secret below, save and click <b>Connect with YouTube</b></li></ol>When connecting, Google shows “Google hasn't verified this app” – that's normal for your own projects (<b>Continue</b>). Your project's daily quota is enough for about 150 title changes."
