Settings.SpeechRecognitionRunsEntirelyOn="Speech recognition runs entirely on your PC (whisper.cpp). Nothing is recorded or saved: the plugin only keeps the last two minutes of audio in memory and remembers the recognized text of the last three minutes. When a new title is written, this text goes to the chosen AI – with Ollama everything stays local. What you say has no influence on game detection."
