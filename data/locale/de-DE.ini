Settings.OnYouTubePluginChangesB="Das Plugin ändert bei YouTube den <b>Titel</b> deines Livestreams (eine Spiel-Kategorie wie bei Twitch bietet die YouTube-Schnittstelle nicht an). Dafür brauchst du einmalig ein eigenes, kostenloses Google-Cloud-Projekt:<ol><li><a href=\"https://console.cloud.google.com/projectcreate\">Projekt anlegen</a> (Name egal)</li><li><a href=\"https://console.cloud.google.com/apis/library/youtube.googleapis.com\">YouTube Data API v3</a> aktivieren</li><li><a href=\"https://console.cloud.google.com/auth/overview\">OAuth-Zustimmungsbildschirm</a> einrichten: Typ <b>Extern</b>, und unter <b>Zielgruppe → Testnutzer</b> dein eigenes Google-Konto eintragen</li><li><a href=\"https://console.cloud.google.com/auth/clients\">Client erstellen</a>: Typ <b>Fernseher und Geräte mit begrenzter Eingabe</b></li><li>Client-ID und Clientschlüssel unten eintragen, speichern und auf <b>Mit YouTube verbinden</b> klicken</li></ol>Google zeigt beim Verbinden einen Hinweis „App nicht überprüft“ – das ist bei eigenen Projekten normal (<b>Weiter</b>). Das Tageslimit deines Projekts reicht für rund 150 Titeländerungen."
