Provider.Gemini="Google Gemini"
Provider.Gemini.Help="Key erstellen: <a href=\"https://aistudio.google.com/apikey\">aistudio.google.com/apikey</a>. In der EU, der Schweiz und Großbritannien erlaubt Google für Programme wie dieses nur die kostenpflichtige API (Google-Cloud-Projekt mit Abrechnung)."
Provider.OpenRouter="OpenRouter (kostenlose Modelle)"
Provider.OpenRouter.Help="Key: <a href=\"https://openrouter.ai/keys\">openrouter.ai/keys</a>. Ohne Guthaben nur rund 50 Anfragen pro Tag – stell das Prüfintervall dann auf mindestens 5 Minuten."
Provider.Ollama="Ollama (lokal, ohne Key)"
Provider.Ollama.Help="Läuft komplett auf deinem PC: <a href=\"https://ollama.com\">ollama.com</a> installieren und ein Bildmodell laden: <code>ollama pull qwen3-vl:4b-instruct</code> (3,3 GB). Braucht ca. 4 GB Grafikspeicher und rechnet pro Prüfung einige Sekunden auf der Grafikkarte."
Provider.Custom="Eigener Server (OpenAI-kompatibel)"
Provider.Custom.Help="Jeder Dienst mit OpenAI-kompatibler Schnittstelle, z. B. LM Studio. Server-URL inklusive <code>/v1</code> eintragen."
Provider.Claude="Anthropic Claude (kostenpflichtig)"
Provider.Claude.Help="Sehr zuverlässige Erkennung, kostet aber pro Anfrage. Key: <a href=\"https://platform.claude.com\">platform.claude.com</a>"
Provider.LmStudio="LM Studio (lokal, ohne Key)"
Provider.LmStudio.Help="Läuft auf deinem PC: <a href=\"https://lmstudio.ai\">lmstudio.ai</a> installieren, ein Bildmodell laden (z. B. Qwen3-VL 4B) und unter <b>Developer</b> den lokalen Server starten. Danach hier „Modelle laden“."
Provider.Jan="Jan (lokal, ohne Key)"
Provider.Jan.Help="Läuft auf deinem PC: <a href=\"https://jan.ai\">jan.ai</a> installieren, ein Bildmodell laden und unter <b>Einstellungen → Local API Server</b> den Server starten. Danach hier „Modelle laden“."
Provider.LlamaCpp="llama.cpp-Server (lokal, ohne Key)"
Provider.LlamaCpp.Help="Für Bastler: <code>llama-server -m modell.gguf --mmproj mmproj.gguf --port 8080</code> mit einem Bildmodell starten. Der Modellname spielt keine Rolle."
Provider.Groq="Groq (kostenloser Key)"
Provider.Groq.Help="Sehr schnell, kostenloser Key mit Tageslimit: <a href=\"https://console.groq.com/keys\">console.groq.com/keys</a>. Groq hat seine Llama-Bildmodelle im Juli 2026 eingestellt – „Modelle laden“ und ein Qwen-Modell mit Bildverständnis wählen (bei Groq als Vorschau gekennzeichnet)."
Provider.Mistral="Mistral (EU)"
Provider.Mistral.Help="Europäischer Anbieter. Key: <a href=\"https://console.mistral.ai/api-keys\">console.mistral.ai</a>. Die Gratis-Stufe ist stark eingeschränkt, sonst kostenpflichtig. Im Gratis-Modus darf Mistral Anfragen zum Training nutzen – in den Datenschutz-Einstellungen deines Kontos kannst du widersprechen."
Provider.Nvidia="NVIDIA NIM (kostenloser Key)"
Provider.Nvidia.Help="Kostenloser Key nach Registrierung: <a href=\"https://build.nvidia.com\">build.nvidia.com</a> → Modell öffnen → „Get API Key“ (beginnt mit <code>nvapi-</code>). Empfohlen: <code>nvidia/nemotron-3-nano-omni-30b-a3b-reasoning</code> – erkennt zuverlässig und antwortet in wenigen Sekunden. Viele andere Modelle in der Liste sind für Gratis-Konten nicht freigeschaltet oder oft überlastet."
Provider.Cloudflare="Cloudflare Workers AI (kostenloses Tageskontingent)"
Provider.Cloudflare.Help="Kostenloses Tageskontingent mit Cloudflare-Konto: <a href=\"https://dash.cloudflare.com/profile/api-tokens\">API-Token</a> mit der Berechtigung „Workers AI“ erstellen und als Key eintragen. In der Server-URL <code>ACCOUNT_ID</code> durch deine Account-ID ersetzen (steht im Cloudflare-Dashboard). Weiteres Bildmodell: <code>@cf/mistralai/mistral-small-3.1-24b-instruct</code>."

