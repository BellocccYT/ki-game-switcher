Settings.IfOBSCapturesOneOf="Nimmt OBS eines dieser Programme auf (Spiel- oder Fensteraufnahme) oder ist es das aktive Fenster, stellt das Plugin sofort und ohne KI auf die Kategorie um – 100 % sicher und kostenlos.<br><b>Emulatoren:</b> Trag dasselbe Programm mehrmals ein, jeweils mit einem Teil des Fenstertitels (z. B. <code>Dolphin.exe</code> + „Mario Kart“ und <code>Dolphin.exe</code> + „Sunshine“). Zeilen mit Fenstertitel gehen vor.<br><b>Eigener Titel</b> (optional, Platzhalter wie in der Vorlage) und <b>Tags</b> gelten nur für dieses Spiel."
